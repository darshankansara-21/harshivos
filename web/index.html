<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WonderPlay - Play. Learn. Calm. Connect. A playful world where every child can explore, learn, and feel good.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WonderPlay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WonderPlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0420">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0B0420;
    }
    /* Make the Flutter view always fill the full viewport. Without this the
       app can collapse to a thin strip at the top of the page on some
       browsers / embedded webviews. */
    flutter-view, flt-glass-pane, flt-scene-host, body > flutter-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: radial-gradient(circle at 50% 35%, #1E1052 0%, #0B0420 70%);
      color: #fff;
      font-family: "Nunito", "Segoe UI", sans-serif;
      transition: opacity 0.6s ease;
      z-index: 10;
    }
    #splash .mark { font-size: 18px; font-weight: 700; color: #bfe9ff; letter-spacing: 0.5px; }
    #splash .name { font-size: 30px; font-weight: 900; letter-spacing: 1.3px; }
    #splash .tag { font-size: 14px; color: rgba(255,255,255,.86); font-weight: 700; }
    #splash .line { max-width: 540px; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.68); padding: 0 22px; }
    #splash .ring {
      width: 38px; height: 38px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #9B8CFF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">Hari + Pico</div>
    <div class="name">WONDERPLAY</div>
    <div class="tag">Play. Learn. Calm. Connect.</div>
    <div class="line">A playful world where every child can explore, learn, and feel good.</div>
    <div class="ring"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () {
        if (splash && splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 700);
    }

    // Avoid stale cached web bundles during local smoke tests.
    (function () {
      var host = window.location.hostname;
      var local = host === 'localhost' || host === '127.0.0.1';
      if (!local || !('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      });
    })();

    window.addEventListener('flutter-first-frame', function () {
      hideSplash();
    });

    // Fallback: hide the splash if first-frame is delayed or not emitted.
    window.setTimeout(hideSplash, 3000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
